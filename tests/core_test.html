<!doctype html>
<!-- Tests for app/core.js. Open in a browser, or run headless:
     chrome --headless --dump-dom tests/core_test.html   (prints PASS/FAIL lines) -->
<meta charset="utf-8">
<title>core.js tests</title>
<pre id="out"></pre>
<script src="../app/core.js"></script>
<script>
const C = DuoCore, lines = [];
let failed = 0;
function eq(name, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  if (!ok) failed++;
  lines.push((ok ? "PASS " : "FAIL ") + name + (ok ? "" : "  got " + JSON.stringify(got) + " want " + JSON.stringify(want)));
}
function at(s, h) { const d = C.pd(s); d.setHours(h || 12); return d; }
function state(over) { return C.normalize(Object.assign({ goal: { perDay: 5, total: 0, start: "2026-10-01", deadline: "" } }, over), at("2026-10-20")); }

try {
  const now = at("2026-10-20");
  // normalize drops junk and keeps src only for logged days
  const n = C.normalize({ log: { "2026-10-01": 3, bad: 4, "2026-10-02": -1 }, src: { "2026-10-01": "sync", "2026-10-05": "manual" }, goal: { perDay: 0 } }, now);
  eq("normalize log", n.log, { "2026-10-01": 3 });
  eq("normalize src", n.src, { "2026-10-01": "sync" });
  eq("normalize perDay clamps", n.goal.perDay, 1);

  // today, goal streak and extra
  let st = state({ log: { "2026-10-17": 5, "2026-10-18": 6, "2026-10-19": 5, "2026-10-20": 7 } });
  let s = C.summary(st, now);
  eq("done/met/extra", [s.done, s.met, s.extra, s.left], [7, true, 2, 0]);
  eq("goal streak includes today", s.goalStreak, 4);
  st = state({ log: { "2026-10-18": 6, "2026-10-19": 5, "2026-10-20": 2 } });
  s = C.summary(st, now);
  eq("streak from yesterday when today unmet", s.goalStreak, 2);
  eq("left today", s.left, 3);

  // overall goal: remaining and per day needed, steady while logging today
  st = state({ goal: { perDay: 5, total: 100, start: "2026-10-01", deadline: "2026-10-29" }, prior: { lessons: 10 }, log: { "2026-10-19": 20 } });
  s = C.summary(st, now);
  eq("remaining", s.remaining, 70);
  eq("days left incl. today", s.daysLeft, 10);
  eq("needed per day", s.neededPerDay, 7);
  eq("behind", s.behind, true);
  st.log["2026-10-20"] = 4;
  eq("needed holds while logging today", C.summary(st, now).neededPerDay, 7);
  eq("logs before start don't count", C.summary(state({ goal: { perDay: 5, total: 50, start: "2026-10-10" }, log: { "2026-10-01": 9, "2026-10-12": 3 } }), now).totalDone, 3);

  // week days
  const wk = C.weekDays(state({ log: { "2026-10-19": 5 } }), C.mondayOf(now), now);
  eq("week starts Monday", [wk[0].key, wk[6].key], ["2026-10-19", "2026-10-25"]);
  eq("week flags", [wk[0].met, wk[1].isToday, wk[2].future], [true, true, true]);

  // study time: average only from timed days
  st = state({ log: { "2026-10-18": 4, "2026-10-19": 2 }, mins: { "2026-10-18": 20 } });
  const t = C.timeStats(st, now);
  eq("avg from timed days", t.avg, 5);
  eq("total includes estimate", t.totalMin, 30);
  eq("default avg when nothing timed", C.timeStats(state({ log: { "2026-10-18": 2 } }), now).avg, 3.5);

  // reminders
  st = state({ notify: { on: true, time: "19:00" } });
  eq("no reminder before time", C.shouldRemind(st, at("2026-10-20", 18)), false);
  eq("reminder after time", C.shouldRemind(st, at("2026-10-20", 20)), true);
  st.notify.lastSent = "2026-10-20";
  eq("only once a day", C.shouldRemind(st, at("2026-10-20", 21)), false);
  eq("note title when unmet", C.reminderNote(C.summary(state({ log: { "2026-10-20": 2 } }), now)).title, "3 lessons to go today");

  // sync with exact gains: manual days are kept
  st = state({ log: { "2026-10-19": 9 }, src: { "2026-10-19": "manual" } });
  const t19 = at("2026-10-19", 9).getTime() / 1000, t20 = at("2026-10-20", 9).getTime() / 1000;
  let m = C.mergeSync(st, { streak: 3, totalXp: 500, courseTitle: "Korean", courseXp: 400,
    gains: [{ t: t19, xp: 10 }, { t: t20, xp: 15 }, { t: t20 + 60, xp: 12 }, { t: t20 + 120, xp: 0 }] }, now);
  eq("gains count lessons per day", m.log["2026-10-20"], 2);
  eq("gains never overwrite manual", m.log["2026-10-19"], 9);
  eq("gains xp per day", m.duo.xpDay["2026-10-20"], 27);
  eq("sync fields", [m.duo.streak, m.duo.courseTitle, m.src["2026-10-20"]], [3, "Korean", "sync"]);

  // sync without gains: estimate from XP
  st = state({ duo: { xpPerLesson: 15 } });
  m = C.mergeSync(st, { streak: 1, totalXp: 1000, gains: null }, at("2026-10-19", 22));
  eq("first sync sets a base only", "2026-10-19" in m.log, false);
  m = C.mergeSync(m, { streak: 2, totalXp: 1045, gains: null }, at("2026-10-20", 10));
  eq("next day: yesterday's last total is the base", [m.log["2026-10-20"], m.duo.xpDay["2026-10-20"]], [3, 45]);
  m = C.mergeSync(m, { streak: 2, totalXp: 1090, gains: null }, at("2026-10-20", 18));
  eq("later same day keeps the base", m.log["2026-10-20"], 6);
  m.log["2026-10-21"] = 1; m.src["2026-10-21"] = "manual";
  m = C.mergeSync(m, { streak: 3, totalXp: 1200, gains: null }, at("2026-10-21", 18));
  eq("estimate never overwrites manual", m.log["2026-10-21"], 1);
  m = C.mergeSync(m, { streak: 0, totalXp: 1500, gains: null }, at("2026-10-25", 9));
  eq("after a gap the base is today's first total", m.log["2026-10-25"], 0);
  m = C.mergeSync(m, { streak: 1, totalXp: 1530, gains: null }, at("2026-10-25", 19));
  eq("then grows through the day", m.log["2026-10-25"], 2);

  // widget data
  const w = C.widgetData(state({ log: { "2026-10-20": 3 } }), now);
  eq("widget numbers", [w.done, w.goal, w.bar, w.status], ["3", "5", "██████░░░░", "2 lessons to go"]);
} catch (e) {
  failed++;
  lines.push("FAIL threw " + e.stack);
}
lines.push(failed ? failed + " FAILED" : "ALL PASSED");
document.getElementById("out").textContent = lines.join("\n");
</script>
